[Latest_Version]
Ver="v3.141.01"
[Change_log]
log="\n- A lot improvements has been made in the latest version, please check online Change log page to learn more.\n\n- 您正在使用老旧版本, 建议立即更新. 最新版中已进行了很多改进, 包含新的超分辨率和补帧(插帧)技术. 请查阅在线更新日志页面以了解更多.\n\n- 您正在使用老舊版本, 建議立即更新. 最新版中已進行了很多改進, 包含新的超分辨率和補幀(插幀)技術. 請查閱在線更新日誌頁面以了解更多."
log_SimplifiedChinese="\n- 新增：放大倍率 / 去噪区域现在会自动适应列表中已添加的媒体类型，并能够记忆当前视图。\n- 新增：图像风格现已统一整合为单个选择器。\n- 文件列表状态在内部进行了重构，并补全了缺失的非英语翻译。\n- 新增：图像批处理功能现已结束 BETA 测试，正式上线。\n- 新增：所有内置帮助文档现已实现完全本地化。\n- 新增：伪装成 .png 的 APNG 文件在添加到列表中时可被实时识别。\n- 修复了 13 个 Bug，详情请参阅官方网站。\n- ★ 您可能错过的其他近期更新：\n- 深色模式：您现在可以在“主页”标签页中切换浅色/深色模式皮肤。\n- 新增：[保留原图的 ICC 配置文件]。部分图片在放大后的色彩准确度将得到提升。\n- 新增图像批量超分辨率处理管线，性能提升超过 300%。\n- 新增：西班牙语语言包。\n- 新增功能：[记录至日志文件]。启用后，系统将自动把所有控制台输出保存到日志文件中。\n\n更新日期: 2026年9月2日"
log_TraditionalChinese="\n- 新增：縮放比例 / 降噪區域現在會自動適應列表中已新增的媒體類型，並能夠記憶當前檢視。\n- 新增：圖片風格現已統一整合為單一選擇器。\n- 檔案列表狀態在內部進行了重構，並補齊了缺失的非英文翻譯。\n- 新增：圖片批次處理功能現已結束 BETA 測試，正式上線。\n- 新增：所有內建說明說明文件現已實現完整在地化。\n- 新增：偽裝成 .png 的 APNG 檔案在新增至列表時可被即時偵測。\n- 修復了 13 個 Bug，詳情請參閱官方網站。\n- ★ 您可能錯過的其他近期更新：\n- 深色模式：您現在可以在「主頁」標籤頁中切換淺色/深色模式外觀。\n- 新增：[保留原圖的 ICC 設定檔]。部分圖片在超解析度後的色彩準確度將得到提升。\n- 新增圖片批次超解析度處理管線，效能提升超過 300%。\n- 新增：西班牙文語言包。\n- 新增功能：[記錄至日誌檔案]。啟用後，系統將自動把所有主控台輸出儲存至日誌檔案中。\n\n更新日期: 2026年9月2日"
log_English="\n- NEW: 日本語翻訳を追加！Add Japanese translation.\n- NEW: The Scale Ratio / Denoise area now adapts to the media types in your list and remembers the view.\n- NEW: Image Style is now a single unified selector.\n- Files List status refactored internally and missing non-English translations completed.\n- NEW: Image Batching is now out of BETA.\n- NEW: All built-in help documents are now fully localized.\n- NEW: APNG files disguised as .png are now detected instantly when added to the list.\n- 13 bugs fixed, see details on website.\n- ★ Other recent updates you might missed:\n- Dark Mode: Now you can switch between light/dark mode skin at the Home tab.\n- NEW: [Keep ICC of the source image]. The after-upscale color accuracy of some pictures will be better.\n- NEW Image Batch Upscale Pipeline, Over 300% Performance Boost.\n- NEW: Spanish Language Pack.\n- NEW Feature: [Log to file]. When enabled, auto saves all console output to log files.\n\nRelease Date: September 2, 2026"
